# One-off: deletes the 8bitmap-aul Worker, which also drops its aul.8bit.nyc custom domain.
# Runs when this file is pushed to dev, and is removed again once it has run.
name: Retire aul

on:
  push:
    branches: [dev]
    paths: ['.github/workflows/retire-aul.yml']
  workflow_dispatch: {}

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d6042a3026e9b43a3cfb01f284dd5345
    steps:
      - name: Delete the 8bitmap-aul Worker
        run: |
          # keep only the token itself, as in deploy-dev.yml
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -o '[[:alnum:]_-]\{30,\}' | tail -1)"
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$@"; }
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          echo "Custom domains on 8bitmap-aul:"
          api "$base/workers/domains?service=8bitmap-aul" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(' ',x['hostname'],x['id']) for x in d.get('result') or []]"
          for id in $(api "$base/workers/domains?service=8bitmap-aul" | python3 -c "import json,sys;print(' '.join(x['id'] for x in json.load(sys.stdin).get('result') or []))"); do
            api -X DELETE "$base/workers/domains/$id" | head -c 300; echo
          done
          api -X DELETE "$base/workers/scripts/8bitmap-aul?force=true" | head -c 500; echo
          echo "Left on the account:"
          api "$base/workers/scripts" | python3 -c "import json,sys;print(' '.join(x['id'] for x in json.load(sys.stdin).get('result') or []))"
