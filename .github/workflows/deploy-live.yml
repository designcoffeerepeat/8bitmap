# Publishes main to the live Worker, 8bitmap, at https://8bitmap.design-coffee-repeat.workers.dev.
# Runs on every push to main and after each scheduled events refresh (pushes made by the refresh
# job's own token don't start other workflows). Same CLOUDFLARE_API_TOKEN secret as deploy-dev.yml.
name: Deploy live

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Refresh events]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: deploy-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d6042a3026e9b43a3cfb01f284dd5345
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to 8bitmap
        if: env.CLOUDFLARE_API_TOKEN != ''
        # Same token clean-up and error annotations as deploy-dev.yml.
        run: |
          set -o pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -o '[[:alnum:]_-]\{30,\}' | tail -1)"
          if ! npx wrangler deploy 2>&1 | tee deploy.log; then
            grep -v '^\s*$' deploy.log | tail -25 | sed 's/^/::error::/'
            exit 1
          fi
          grep -o 'https://[^ ]*workers.dev' deploy.log | sed 's/^/::notice::Live site: /' || true
      - name: Explain the missing token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Add the CLOUDFLARE_API_TOKEN repository secret to publish live."
