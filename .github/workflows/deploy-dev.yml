# Publishes the dev branch to its own Worker, 8bitmap-dev, so changes can be tested
# at https://8bitmap-dev.design-coffee-repeat.workers.dev before they reach main.
# The dev site has its own password (SITE_PASSWORD below); live keeps the one in wrangler.jsonc.
# Needs the CLOUDFLARE_API_TOKEN repository secret (an "Edit Cloudflare Workers" token).
name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d6042a3026e9b43a3cfb01f284dd5345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # PUBLIC_SITE=dev keeps the sources that live leaves out (src/scripts/events/live.js).
      - run: npm run build
        env:
          PUBLIC_SITE: dev
      - name: Deploy to 8bitmap-dev
        if: env.CLOUDFLARE_API_TOKEN != ''
        # Wrangler's own messages become annotations, since the job log isn't always at hand.
        run: |
          set -o pipefail
          # The secret may hold Cloudflare's whole "verify" command rather than the bare token,
          # so keep only the token itself: the one long run of letters, digits, _ and -.
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -o '[[:alnum:]_-]\{30,\}' | tail -1)"
          if ! npx wrangler deploy --name 8bitmap-dev --var SITE:dev --var SITE_PASSWORD:alpha8bit01 2>&1 | tee deploy.log; then
            grep -v '^\s*$' deploy.log | tail -25 | sed 's/^/::error::/'
            exit 1
          fi
          grep -o 'https://[^ ]*workers.dev' deploy.log | sed 's/^/::notice::Dev site: /' || true
      - name: Explain the missing token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Add the CLOUDFLARE_API_TOKEN repository secret to publish dev."
