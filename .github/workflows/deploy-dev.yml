# Publishes the dev branch to its own Worker, 8bitmap-dev, so changes can be tested
# at https://8bitmap-dev.design-coffee-repeat.workers.dev before they reach main.
# Needs the CLOUDFLARE_API_TOKEN repository secret (an "Edit Cloudflare Workers" token).
name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d6042a3026e9b43a3cfb01f284dd5345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Describe the token without revealing it
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          t="$CLOUDFLARE_API_TOKEN"
          echo "::notice::Token shape: ${#t} characters, $(printf '%s' "$t" | tr -cd '[:space:]' | wc -c) spaces or line breaks, $(printf '%s' "$t" | tr -d '[:alnum:]_[:space:]-' | wc -c) other symbols, $(printf '%s' "$t" | grep -o '[[:alnum:]_-]\{20,\}' | wc -l) long word(s)"
      - name: Deploy to 8bitmap-dev
        if: env.CLOUDFLARE_API_TOKEN != ''
        # Wrangler's own messages become annotations, since the job log isn't always at hand.
        run: |
          set -o pipefail
          # A pasted token often carries a trailing newline or space, which Cloudflare rejects.
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          if ! npx wrangler deploy --name 8bitmap-dev 2>&1 | tee deploy.log; then
            grep -v '^\s*$' deploy.log | tail -25 | sed 's/^/::error::/'
            exit 1
          fi
          grep -o 'https://[^ ]*workers.dev' deploy.log | sed 's/^/::notice::Dev site: /' || true
      - name: Explain the missing token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Add the CLOUDFLARE_API_TOKEN repository secret to publish dev."
