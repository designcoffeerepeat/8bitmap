# Pulls today's and tomorrow's events from every source fetcher (tools/fetch_*.py) and commits the new snapshots.
# The push to main makes Cloudflare rebuild, so the live map always shows the current NYC day.
# The schedule refreshes both main and dev; a manual run refreshes the branch it is started on.
# A push made with the workflow's own token does not start other workflows, so a run on dev
# starts the Deploy dev workflow itself.
name: Refresh events

on:
  schedule:
    # 08:30 and 16:30 UTC: early morning and midday in New York, all year round
    - cron: '30 8,16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # lets a run on dev start Deploy dev

concurrency:
  group: refresh-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        branch: ${{ github.event_name == 'schedule' && fromJSON('["main", "dev"]') || fromJSON(format('["{0}"]', github.ref_name)) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch today's events from every source
        # A failing source keeps its previous file; the other sources still update.
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
        run: |
          for f in tools/fetch_*.py; do
            echo "::group::$f"
            python3 "$f" || echo "::warning::$f failed"
            echo "::endgroup::"
          done
      - name: Fetch tomorrow's events from every source
        # Written to public/data/tomorrow/ for the TOMORROW view (click the date in the header).
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
          EVENTS_DIR: public/data/tomorrow
        run: |
          day="$(TZ=America/New_York date -d tomorrow +%F)"
          for f in tools/fetch_*.py; do
            echo "::group::$f $day"
            python3 "$f" "$day" || echo "::warning::$f failed for $day"
            echo "::endgroup::"
          done
      - name: Commit if anything changed
        id: commit
        run: |
          git add public/data data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh events for $(TZ=America/New_York date +%F)"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild the dev site with the new snapshots
        if: matrix.branch == 'dev' && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-dev.yml --ref dev
